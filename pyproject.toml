[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "urdforge"
version = "0.2.0"
description = "Industrial STEP CAD-to-URDF visual modeling and simulation toolkit"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
